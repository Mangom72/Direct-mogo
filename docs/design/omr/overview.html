<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>답안지 입력 시안 안내</title><link rel="stylesheet" href="../../../fonts/fonts.css"><link rel="stylesheet" href="demo.css"></head><body><main class="demo"><h1>공개 견본으로 답안 입력</h1><p>실제 교육청 공개 수능 견본의 답란을 누르는 방식과 사진에서 읽는 방식을 체험할 수 있습니다. 과목을 바꾸면 영역·교시·문항 배치가 바뀌고, 회차를 바꾸면 시행 연도와 시험명이 바뀝니다.</p><p>사진은 모서리 보정 → 답란 읽기 → 원본과 전체 답안 확인 → 채점 순서입니다. 종이 촬영 정확도는 아직 현장 검증 전이며, 자동 채점용 정답표가 없는 회차는 정답·배점을 입력해야 합니다.</p><a href="index.html">입력 시안 열기</a> · <a href="sheet.html">공개 견본 보기</a></main></body></html>
