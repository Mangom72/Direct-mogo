name: 기출 자료 갱신

on:
  schedule:
    # 매일 14:00 UTC = 23:00 KST.
    #
    # EBSi가 올리는 시각을 파일 헤더(Last-Modified)로 재서 정했다. 시행일을 0시로
    # 놓고 보면 정답은 +11~18시간, 문제는 +9~19시간이라 대개 시행 당일 저녁이면
    # 둘 다 올라와 있다. 23시에 보면 그날 시험은 그날 안에 실린다.
    #
    # 해설은 다르다. 평가원 시험은 다음 날 오후가 보통이고 늦으면 나흘 뒤,
    # 문제조차 엿새 늦은 회차가 있었다. 그래서 한 번에 다 잡는 것을 노리지 않고,
    # 매일 보면서 비어 있는 칸을 뒤늦게 채운다(refresh_data.py의 top_up).
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      # 스크립트는 수집량이 기존의 80%에 못 미치면 스스로 실패한다.
      # EBSi 구조가 바뀌면 조용히 빈손이 되는 대신 여기서 빨갛게 떠야 한다.
      - name: 새 회차 수집
        run: python3 tools/refresh_data.py --note "$RUNNER_TEMP/note.txt"

      # 하루에 한 번 도는데 새 자료가 있는 날은 한 달에 며칠뿐이다. 나머지 날에
      # 정적 JSON·과목 페이지·글꼴을 다시 만드는 것은 통째로 헛일이다 — 특히
      # 글꼴은 원본 13MB를 내려받는다. 페이로드가 그대로면 여기서 끝낸다.
      - name: 바뀐 게 있는지
        id: changed
        run: |
          if git diff --quiet -- index.html; then
            echo "새 회차 없음 — 여기서 끝냅니다"
            echo "yes=0" >> "$GITHUB_OUTPUT"
          else
            echo "yes=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 글꼴 도구 설치
        if: steps.changed.outputs.yes == '1'
        run: pip install "fonttools[woff]" brotli

      # 앱 페이로드와 AI·프로그램용 JSON이 어긋나면 안 되므로 같은 실행에서 다시 만든다
      - name: 정적 JSON 다시 만들기
        if: steps.changed.outputs.yes == '1'
        run: python3 tools/build_api.py

      # 검색엔진이 읽는 과목 페이지도 같은 자료에서 나온다. 여기서 같이 만들지 않으면
      # 새 회차가 앱에는 있는데 검색에는 없는 상태로 하루를 간다.
      - name: 과목 페이지·사이트맵 다시 만들기
        if: steps.changed.outputs.yes == '1'
        run: python3 tools/build_pages.py

      # 글꼴에는 화면에 나오는 글자만 담겨 있다. 새 회차 제목에 없던 글자가 있으면
      # 그 자리가 네모(□)로 보이므로, 자료가 늘어난 그 자리에서 글꼴도 다시 만든다.
      # 과목 페이지를 먼저 만든 뒤라야 그쪽 글자까지 함께 본다.
      - name: 글꼴 다시 만들기
        if: steps.changed.outputs.yes == '1'
        run: python3 tools/build_fonts.py

      # 사람이 보지 않는 채로 나가는 커밋이므로, 내보내기 전에 자료를 한 번 본다.
      #
      # 화면을 여는 시험(tests/ 대부분)은 여기서 돌리지 않는다. 크로미움을 받는 데만
      # 1~2분이고 실행에 3분이 더 드는데, 이 작업이 건드리는 것은 자료뿐이라 화면
      # 코드가 깨질 일이 없다. 대신 자료가 어긋나는 길은 여기서 다 막는다 —
      # 회차 이름표가 겹치는가, 시험 종류와 출제 기관이 맞는가, 학년도가 맞는가,
      # 과목 별칭이 두 과목을 가리키지 않는가(test_fields), 그리고 같은 자료에서
      # 같은 파일이 나오는가(test_stable). 둘 다 브라우저 없이 몇 초면 끝난다.
      #
      # 여기서 실패하면 커밋 단계로 가지 않는다. 자료는 어제 것 그대로 남고,
      # 워크플로가 빨갛게 떠서 사람이 본다.
      - name: 나간 자료 확인
        if: steps.changed.outputs.yes == '1'
        run: |
          python3 tests/test_fields.py
          python3 tests/test_stable.py

      - name: 변경분 커밋
        if: steps.changed.outputs.yes == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data llms.txt llms-full.txt fonts s sitemap.xml
          # 무엇이 늘었는지 메시지에 남긴다. 화면의 '자료 갱신 내역'이 이 괄호
          # 안을 읽어 그날 무슨 일이 있었는지 보여준다.
          NOTE=$(cat "$RUNNER_TEMP/note.txt" 2>/dev/null || true)
          git commit -m "Refresh exam data from EBSi${NOTE:+ ($NOTE)}"
          git push

      # 화면은 수능 시행일을 관례(11월 13~19일 목요일)로 셈하므로 평소에는 손댈
      # 것이 없다. 문제는 그 관례가 깨질 때다 — 시험이 연기되거나(2017 포항 지진,
      # 2020 코로나) 평가원이 다른 날로 공고하면, 화면은 그것을 모른 채 옛 관례대로
      # 센다. 스스로는 절대 알아차리지 못하므로 여기서 매일 밖과 견준다.
      #
      # 견주는 곳은 한국어 위키백과의 학년도별 인포박스다. 공식 쪽에는 기계가 읽을
      # 출처가 없다(평가원 RSS 없음, 공공데이터포털에도 없음). **그 값을 화면에
      # 쓰지는 않는다** — 누구나 고칠 수 있는 문서라 그대로 믿을 수 없다. 어긋나면
      # 사람이 공고를 확인하고 index.html 의 SUNEUNG_MOVED 에 적는다. 위키백과에
      # 닿지 못하는 것은 잘못이 아니므로 그때는 그냥 넘어간다.
      #
      # 자료 커밋 **뒤에** 둔다. 날짜가 어긋났다고 그날의 자료 갱신까지 막을 이유는
      # 없다. 자료는 그대로 나가고, 워크플로만 빨갛게 떠서 사람이 본다.
      # 브라우저도 서버도 쓰지 않아 몇 밀리초면 끝난다.
      - name: 수능 날짜 대조
        if: always()
        run: python3 tests/test_dday.py --date

      # 위의 수집 단계는 '수집량이 기존의 80%에 못 미치면' 스스로 실패하므로,
      # EBSi 화면이 바뀌어 스크레이퍼가 빈손이 되는 경우는 거기서 잡힌다.
      #
      # 잡지 못하는 결이 하나 남는다 — 옛 자료는 그대로 잘 주면서 **새 회차만**
      # 안 올라오는 경우다. 수집량은 100%이고 매일 초록불인데 자료는 그날로
      # 멈춘다. 사람이 지켜보지 않는 것을 전제로 만든 저장소라 알아차릴 자리가
      # 없다.
      #
      # '며칠째 새 회차가 없으면'으로는 못 잡는다. 시행일 간격이 원래 들쭉날쭉해
      # 3월 중순은 127일, 7~9월도 53일이 비는 것이 정상이라, 문턱을 그 위에 두면
      # 4개월짜리 알람이 되어 아무것도 못 잡는다.
      #
      # 그래서 수능 하나만 본다. 날짜를 우리가 셈할 수 있는 유일한 회차이고
      # 반드시 올라온다. 거짓 경보가 원리적으로 나올 수 없다.
      - name: 새 회차가 올라오고 있는가
        if: always()
        run: python3 tools/check_fresh.py

      # 공개 저장소의 예약 워크플로는 **저장소에 60일 동안 아무 일도 없으면
      # 깃허브가 알아서 꺼 버린다.** 워크플로가 돈 것은 활동으로 치지 않는다.
      #
      # 이 저장소는 그 함정에 정확히 걸리는 모양이다. 새 자료가 없는 날은 아무것도
      # 커밋하지 않도록 일부러 만들어 두었는데, 시험이 없는 겨울(11월 수능이 끝난
      # 뒤부터 3월 학평 전까지)이 60일보다 길다. 그동안 커밋이 한 건도 나가지
      # 않으면 갱신이 조용히 멈추고, 3월에 새 학년도가 시작되어도 아무도 모른다.
      # 사람이 지켜보지 않는 것을 전제로 만든 것이라 알아차릴 자리가 없다.
      #
      # 그래서 50일 넘게 조용하면 빈 커밋 하나로 시계를 되감는다. 열흘의 여유를
      # 두는 것은 이 작업이 며칠 연달아 실패해도 넘기지 않게 하기 위해서다.
      # 자료가 도는 철에는 한 번도 걸리지 않고, 겨울에도 해야 두어 번이다.
      # 아무 파일도 건드리지 않으므로 다른 워크플로를 깨우지도 않는다.
      - name: 예약이 꺼지지 않게
        if: always()
        run: |
          set -euo pipefail
          QUIET=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "마지막 커밋에서 ${QUIET}일 지났습니다 (50일부터 깨웁니다)"
          if [ "$QUIET" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled refresh from being disabled"
            git push
          fi
