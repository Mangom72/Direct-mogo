name: 기출 자료 갱신

on:
  schedule:
    # 매월 5일 03:00 UTC (KST 정오) — 전월 시행분이 EBSi에 올라온 뒤
    - cron: "0 3 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests "fonttools[woff]" brotli

      # 스크립트는 수집량이 기존의 80%에 못 미치면 스스로 실패한다.
      # EBSi 구조가 바뀌면 조용히 빈손이 되는 대신 여기서 빨갛게 떠야 한다.
      - name: 새 회차 수집
        run: python3 tools/refresh_data.py

      # 앱 페이로드와 AI·프로그램용 JSON이 어긋나면 안 되므로 같은 실행에서 다시 만든다
      - name: 정적 JSON 다시 만들기
        run: python3 tools/build_api.py

      # 글꼴에는 화면에 나오는 글자만 담겨 있다. 새 회차 제목에 없던 글자가 있으면
      # 그 자리가 네모(□)로 보이므로, 자료가 늘어난 그 자리에서 글꼴도 다시 만든다.
      - name: 글꼴 다시 만들기
        run: python3 tools/build_fonts.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- index.html data llms.txt fonts; then
            echo "새 회차 없음 — 커밋하지 않습니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data llms.txt fonts
          git commit -m "Refresh exam data from EBSi"
          git push
