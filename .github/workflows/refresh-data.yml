name: 기출 자료 갱신

on:
  schedule:
    # 매일 14:00 UTC = 23:00 KST.
    #
    # EBSi가 올리는 시각을 파일 헤더(Last-Modified)로 재서 정했다. 시행일을 0시로
    # 놓고 보면 정답은 +11~18시간, 문제는 +9~19시간이라 대개 시행 당일 저녁이면
    # 둘 다 올라와 있다. 23시에 보면 그날 시험은 그날 안에 실린다.
    #
    # 해설은 다르다. 평가원 시험은 다음 날 오후가 보통이고 늦으면 나흘 뒤,
    # 문제조차 엿새 늦은 회차가 있었다. 그래서 한 번에 다 잡는 것을 노리지 않고,
    # 매일 보면서 비어 있는 칸을 뒤늦게 채운다(refresh_data.py의 top_up).
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # 스크립트는 수집량이 기존의 80%에 못 미치면 스스로 실패한다.
      # EBSi 구조가 바뀌면 조용히 빈손이 되는 대신 여기서 빨갛게 떠야 한다.
      - name: 새 회차 수집
        run: python3 tools/refresh_data.py

      # 하루에 한 번 도는데 새 자료가 있는 날은 한 달에 며칠뿐이다. 나머지 날에
      # 정적 JSON·과목 페이지·글꼴을 다시 만드는 것은 통째로 헛일이다 — 특히
      # 글꼴은 원본 13MB를 내려받는다. 페이로드가 그대로면 여기서 끝낸다.
      - name: 바뀐 게 있는지
        id: changed
        run: |
          if git diff --quiet -- index.html; then
            echo "새 회차 없음 — 여기서 끝냅니다"
            echo "yes=0" >> "$GITHUB_OUTPUT"
          else
            echo "yes=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 글꼴 도구 설치
        if: steps.changed.outputs.yes == '1'
        run: pip install "fonttools[woff]" brotli

      # 앱 페이로드와 AI·프로그램용 JSON이 어긋나면 안 되므로 같은 실행에서 다시 만든다
      - name: 정적 JSON 다시 만들기
        if: steps.changed.outputs.yes == '1'
        run: python3 tools/build_api.py

      # 검색엔진이 읽는 과목 페이지도 같은 자료에서 나온다. 여기서 같이 만들지 않으면
      # 새 회차가 앱에는 있는데 검색에는 없는 상태로 하루를 간다.
      - name: 과목 페이지·사이트맵 다시 만들기
        if: steps.changed.outputs.yes == '1'
        run: python3 tools/build_pages.py

      # 글꼴에는 화면에 나오는 글자만 담겨 있다. 새 회차 제목에 없던 글자가 있으면
      # 그 자리가 네모(□)로 보이므로, 자료가 늘어난 그 자리에서 글꼴도 다시 만든다.
      # 과목 페이지를 먼저 만든 뒤라야 그쪽 글자까지 함께 본다.
      - name: 글꼴 다시 만들기
        if: steps.changed.outputs.yes == '1'
        run: python3 tools/build_fonts.py

      # 사람이 보지 않는 채로 나가는 커밋이므로, 내보내기 전에 자료를 한 번 본다.
      #
      # 화면을 여는 시험(tests/ 대부분)은 여기서 돌리지 않는다. 크로미움을 받는 데만
      # 1~2분이고 실행에 3분이 더 드는데, 이 작업이 건드리는 것은 자료뿐이라 화면
      # 코드가 깨질 일이 없다. 대신 자료가 어긋나는 길은 여기서 다 막는다 —
      # 회차 이름표가 겹치는가, 시험 종류와 출제 기관이 맞는가, 학년도가 맞는가,
      # 과목 별칭이 두 과목을 가리키지 않는가(test_fields), 그리고 같은 자료에서
      # 같은 파일이 나오는가(test_stable). 둘 다 브라우저 없이 몇 초면 끝난다.
      #
      # 여기서 실패하면 커밋 단계로 가지 않는다. 자료는 어제 것 그대로 남고,
      # 워크플로가 빨갛게 떠서 사람이 본다.
      - name: 나간 자료 확인
        if: steps.changed.outputs.yes == '1'
        run: |
          python3 tests/test_fields.py
          python3 tests/test_stable.py

      - name: 변경분 커밋
        if: steps.changed.outputs.yes == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data llms.txt llms-full.txt fonts s sitemap.xml
          git commit -m "Refresh exam data from EBSi"
          git push
