name: APK 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # 서명된 빌드를 app/ 에 올려 커밋한다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 러너 이미지에 Android SDK가 이미 깔려 있어 ANDROID_HOME을 따로 잡을 필요가 없다
      - uses: gradle/actions/setup-gradle@v4

      # 저장소 시크릿에 키를 넣어두면 릴리스 서명으로, 없으면 디버그로 빌드한다.
      # secrets 컨텍스트는 스텝의 if에서 쓸 수 없다 — 넣으면 워크플로 자체가
      # 시작 전에 실패한다(잡 0개). 그래서 env로 받아 셸에서 판단한다.
      - name: 서명 키 준비
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > gijul-release.jks
            echo "release=1" >> "$GITHUB_ENV"
          else
            echo "서명 키 시크릿이 없어 debug로 빌드합니다"
          fi

      - name: assembleRelease
        if: ${{ env.release == '1' }}
        working-directory: android
        env:
          GIJUL_STORE_FILE: gijul-release.jks
          GIJUL_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GIJUL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GIJUL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: assembleDebug
        if: ${{ env.release != '1' }}
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 키 지우기
        if: always()
        working-directory: android
        run: rm -f gijul-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: gijul-direct-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 앱은 app/latest.json을 읽어 스스로 새 버전을 찾는다. 서명된 빌드일 때만
      # 올린다 — 서명이 다른 APK는 기기가 어차피 거부하므로 올려봐야 해롭다.
      # versionCode가 늘지 않았으면 스크립트가 스스로 멈춘다.
      - name: 사이트에 올리기
        if: ${{ env.release == '1' && github.ref == 'refs/heads/main' }}
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # 알림 막대에 들어가므로 커밋 메시지의 첫 줄만 쓴다
          if python3 tools/publish_apk.py --notes "$(printf %s "$NOTES" | head -1)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app
            git diff --cached --quiet || git commit -m "Publish the app update manifest"
            git push
          else
            echo "올릴 새 판본이 없습니다 — 넘어갑니다"
          fi
