name: APK 빌드

on:
  workflow_dispatch:
  push:
    # main 에서만 돈다. 같은 커밋을 작업 브랜치에도 올리므로, 브랜치를 가리지
    # 않으면 푸시 한 번에 안드로이드 빌드가 두 벌 돈다. 그런데 올리는 단계는
    # 아래에서 main 인지 다시 보므로 브랜치 쪽 실행은 빌드만 하고 버려진다.
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # 서명된 빌드를 app/ 에 올려 커밋한다

# 이 워크플로는 마지막에 app/ 을 커밋해 밀어 넣는다. 두 벌이 겹치면 늦은 쪽이
# non-fast-forward 로 떨어지므로, 한 번에 하나만 돌린다. 앞선 것을 끊지는
# 않는다 — 이미 서명해 올리는 중일 수 있다.
concurrency:
  group: android-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      # 러너 이미지에 Android SDK가 이미 깔려 있어 ANDROID_HOME을 따로 잡을 필요가 없다.
      #
      # Gradle 판본과 배포 ZIP 지문은 저장소의 Wrapper가 함께 못박는다. 로컬과
      # CI가 같은 실행 파일을 쓰고, 내려받은 배포본이 바뀌어도 시작 전에 막힌다.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # publish_apk.py 가 알림 문구의 글자가 글꼴에 있는지 확인하는데, 그
      # 확인이 fontTools 를 쓴다. 없으면 확인이 깨지고 발행이 통째로 멈춘다.
      - run: pip install -r requirements/fonts.txt

      # 자료 갱신이 함께 들어온 커밋에서도 APK가 방금 만든 글꼴을 품게 한다.
      # 웹 글꼴만 새것이고 앱 글꼴은 전날 것이 되는 갈래를 빌드 전에 닫는다.
      - name: 웹과 앱 글꼴 맞추기
        run: python3 tools/build_fonts.py

      # 회차 이름을 줄이는 규칙과 수능 날 셈이 페이지와 앱 양쪽에 두 벌로 있다.
      # 어긋나도 아무 데서도 안 걸리므로(둘 다 오류가 아니다) 여기서 견준다.
      # 브라우저를 안 써서 몇 초면 끝난다 — 회귀 시험 전체를 여기서 돌릴 것은
      # 아니지만, 이 하나는 자바를 고칠 때마다 봐야 하는 것이다.
      - name: 화면과 앱이 같은 말을 하는가
        run: python3 tests/test_twins.py

      # 기기 없이 돌아가는 단위 시험 32개. 틀려도 조용히 틀리는 자리만 골랐다 —
      # 허용 목록, 이름 거르기, 열쇠 가르기, 연속 일수. 위젯이 실제로 그려지는
      # 모습이나 SAF·웹뷰는 여기서 못 보고, 이 시험이 그것을 대신하지도 않는다.
      # 8초면 끝나므로 빌드 앞에 둔다 — 서명해서 릴리스까지 낸 다음에 셈이
      # 틀렸다는 것을 알아 봐야 늦다.
      - name: 단위 시험
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # 저장소 시크릿에 키를 넣어두면 릴리스 서명으로, 없으면 디버그로 빌드한다.
      # secrets 컨텍스트는 스텝의 if에서 쓸 수 없다 — 넣으면 워크플로 자체가
      # 시작 전에 실패한다(잡 0개). 그래서 env로 받아 셸에서 판단한다.
      - name: 서명 키 준비
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > gijul-release.jks
            echo "release=1" >> "$GITHUB_ENV"
          else
            echo "서명 키 시크릿이 없어 debug로 빌드합니다"
          fi

      - name: assembleRelease
        if: ${{ env.release == '1' }}
        working-directory: android
        env:
          GIJUL_STORE_FILE: gijul-release.jks
          GIJUL_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GIJUL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GIJUL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: assembleDebug
        if: ${{ env.release != '1' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 키 지우기
        if: always()
        working-directory: android
        run: rm -f gijul-release.jks

      # 서명 인증서가 바뀌면 기존 사용자 기기가 업데이트를 **영구히** 거부한다.
      # 지우고 다시 깔라고 할 수밖에 없고 받아둔 자료도 함께 사라진다. 그러니
      # 나가기 전에 여기서 막는다. 이 지문은 docs/assetlinks.json 의 것과 같아야
      # 하며, 그쪽이 어긋나면 앱 링크도 함께 깨진다.
      - name: 서명 확인
        if: ${{ env.release == '1' }}
        env:
          WANT: "54:37:0E:D9:0C:11:E5:3D:BC:7D:3C:C0:55:58:F4:9D:D1:11:BD:65:78:E4:33:85:0D:6E:83:62:2C:FD:10:C1"
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          # apksigner 는 콜론 없는 소문자로 찍는다. assetlinks 쪽 표기에 맞춘다.
          NORM=$(printf %s "$WANT" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "지문 $GOT"
          if [ "$GOT" != "$NORM" ]; then
            echo "기대한 값 $NORM"
            echo "서명 키가 다릅니다 — 이대로 내보내면 기존 사용자가 영영 업데이트를 못 받습니다"
            exit 1
          fi
          echo "이전 판본과 같은 키입니다"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gijul-direct-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 앱은 app/latest.json을 읽어 스스로 새 버전을 찾는다. 서명된 빌드일 때만
      # 올린다 — 서명이 다른 APK는 기기가 어차피 거부하므로 올려봐야 해롭다.
      # versionCode가 늘지 않았으면 스크립트가 스스로 멈춘다.
      #
      # 차례가 중요하다. **릴리스를 먼저 만들고 latest.json 을 나중에 커밋한다** —
      # 반대로 하면 명세가 아직 없는 주소를 가리키는 동안 앱이 그것을 읽고
      # 내려받기에 실패한다.
      - name: 사이트에 올리기
        if: ${{ env.release == '1' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APK: android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          # 이 한 줄은 사용자의 알림 막대에 그대로 뜬다. 커밋 제목은 영어 관례라
          # 그것을 쓰면 "Release 4.9" 같은 말이 화면에 나간다. 그래서 커밋 본문의
          # 'Notes: …' 줄을 찾아 쓰고, 없으면 무난한 한 줄로 대신한다.
          #
          # 커밋 메시지는 git 에서 읽는다. github.event.head_commit 은 push 로
          # 돌 때만 있어서, 수동 실행(workflow_dispatch)에서는 비어 버린다.
          # 마지막 것을 쓴다. 트레일러는 관례상 끝에 붙고, 본문 중간에 우연히
          # 'Notes:' 로 시작하는 줄이 있으면 앞의 것이 이겨 버린다 — 실제로
          # 그렇게 엉뚱한 문장이 뽑힌 적이 있다. (head 와 달리 tail 은 앞의
          # sed 를 SIGPIPE 로 끊지도 않는다.)
          NOTES=$(git log -1 --format=%B | sed -n 's/^[Nn]otes:[[:space:]]*//p' | tail -1)
          [ -n "$NOTES" ] || NOTES="앱을 새로 고쳤습니다"
          echo "알림 문구: $NOTES"

          # 3은 '올릴 것이 없다'(versionCode 그대로)뿐이다. 다른 코드는 진짜
          # 고장이므로 그대로 실패시킨다 — 전에는 전부 넘겨서, 글꼴 검사가
          # 깨져 아무것도 안 올라간 실행이 초록불로 끝났다.
          set +e
          python3 tools/publish_apk.py --notes "$NOTES"
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "올릴 새 판본이 없습니다 — 넘어갑니다"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"

          python3 - <<'PY'
          import hashlib, json, os, sys, urllib.error, urllib.request

          TOKEN, REPO = os.environ["GH_TOKEN"], os.environ["REPO"]
          API = f"https://api.github.com/repos/{REPO}"
          m = json.load(open("app/latest.json"))
          tag = "v" + m["versionName"]

          blob = open(os.environ["APK"], "rb").read()
          if len(blob) != m["size"] or hashlib.sha256(blob).hexdigest() != m["sha256"]:
              sys.exit("빌드된 APK가 방금 쓴 명세와 다릅니다")

          def call(url, data=None, ctype="application/json"):
              req = urllib.request.Request(url, data=data)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              if data is not None:
                  req.add_header("Content-Type", ctype)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          st, rel = call(f"{API}/releases/tags/{tag}")
          if st != 200:
              body = json.dumps({"tag_name": tag,
                                 "name": f"{tag} (versionCode {m['versionCode']})",
                                 "body": m.get("notes") or "",
                                 "draft": False, "prerelease": False},
                                ensure_ascii=False).encode()
              st, rel = call(f"{API}/releases", body)
              if "id" not in rel:
                  sys.exit(f"릴리스를 만들지 못했습니다 ({st}) {rel}")

          assets = [a for a in rel.get("assets", []) if a.get("name") == "gijul-direct.apk"]
          if assets:
              a = assets[0]
              if a.get("size") != m["size"]:
                  sys.exit(f"기존 {tag} 자산 크기가 이번 APK와 다릅니다")
              req = urllib.request.Request(a["browser_download_url"],
                                           headers={"User-Agent": "gijul-release-check"})
              with urllib.request.urlopen(req) as response:
                  old = response.read(m["size"] + 1)
              if hashlib.sha256(old).hexdigest() != m["sha256"]:
                  sys.exit(f"기존 {tag} 자산 지문이 이번 APK와 다릅니다")
              print("기존 릴리스 자산을 검증해 이어 씁니다", tag, "·", a["browser_download_url"])
          else:
              st, a = call(f"https://uploads.github.com/repos/{REPO}/releases/{rel['id']}"
                           "/assets?name=gijul-direct.apk",
                           blob, "application/vnd.android.package-archive")
              if a.get("state") != "uploaded" or a.get("size") != m["size"]:
                  sys.exit(f"자산을 올리지 못했습니다 ({st}) {a}")
              print("릴리스", tag, "·", a["browser_download_url"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 글꼴이 바뀌었으면 명세와 같은 커밋으로 나간다 — 따로 내보내면 그
          # 사이에 화면이 네모를 띄우는 순간이 생긴다.
          git add app/latest.json fonts android/app/src/main/res/font
          git diff --cached --quiet || git commit -m "Publish the app update manifest"
          # 매일 도는 자료 갱신도 fonts 를 건드린다. 겹치는 일은 드물지만,
          # 겹쳤을 때 릴리스만 올라가고 명세가 빠지는 것이 제일 나쁘다.
          git push || { git pull --rebase origin main && git push; }
