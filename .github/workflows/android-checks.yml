name: Android PR 검증

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/build_fonts.py'
      - 'tests/test_twins.py'
      - 'requirements/fonts.txt'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-checks.yml'

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - run: pip install -r requirements/fonts.txt
      - name: 화면·앱 규칙과 글꼴 확인
        run: |
          python3 tests/test_twins.py
          python3 tools/build_fonts.py --check

      - name: 단위 시험·Lint·디버그 빌드
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
