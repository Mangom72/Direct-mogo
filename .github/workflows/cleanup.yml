name: 임시 브랜치 지우기 (일회성)

# 옛 APK를 릴리스로 넘기려고 apk-archive-temp 브랜치에 잠깐 얹어 두었다. 릴리스로
# 다 올라갔으니 지워야 한다 — 그 브랜치가 남아 있으면 클론이 55MB의 APK를 그대로
# 받아 가서, 히스토리를 재작성한 의미가 없어진다.
#
# ref 삭제는 이 저장소를 다루는 세션의 git 으로 통과되지 않아(태그도 같았다)
# 워크플로가 API로 지운다. 지우고 나면 이 파일도 없앤다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: apk-archive-temp 지우기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          TOKEN, REPO = os.environ["GH_TOKEN"], os.environ["REPO"]
          API = f"https://api.github.com/repos/{REPO}"
          REF = "heads/apk-archive-temp"

          def call(url, method="GET"):
              """상태 코드만 본다 — 여기서는 있고 없고가 전부다."""
              req = urllib.request.Request(url, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code

          if call(f"{API}/git/ref/{REF}") == 404:
              print("이미 없습니다")
              sys.exit(0)

          print("지우기 HTTP", call(f"{API}/git/refs/{REF}", "DELETE"))

          st = call(f"{API}/git/ref/{REF}")
          if st != 404:
              sys.exit(f"아직 남아 있습니다 (HTTP {st})")
          print("apk-archive-temp 를 지웠습니다")

          # 릴리스가 멀쩡한지 같은 자리에서 본다 — 브랜치를 지운 뒤 APK가 남는
          # 곳은 릴리스뿐이므로, 여기서 세어 두는 것이 마지막 그물이다.
          req = urllib.request.Request(f"{API}/releases?per_page=100")
          req.add_header("Authorization", "Bearer " + TOKEN)
          with urllib.request.urlopen(req) as r:
              rels = json.loads(r.read())
          with_apk = [x for x in rels
                      if any(a["name"] == "gijul-direct.apk" for a in x["assets"])]
          print(f"릴리스 {len(rels)}개 · APK가 붙은 것 {len(with_apk)}개")
          if len(with_apk) != 33:
              sys.exit("33개여야 합니다")
          PY
