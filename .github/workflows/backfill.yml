name: 옛 판본 릴리스로 올리기 (일회성)

# v1.6~v4.7 은 예전에 실제로 사용자에게 나갔던 판본인데, 히스토리에서 APK를
# 걷어내면서 저장소 어디에도 남지 않게 됐다. 남겨 둘 자리는 릴리스뿐이다.
#
# APK 자체는 apk-archive-temp 브랜치에 얹어 두었다. 저장소 히스토리에 다시
# 커밋하면 방금 13MB로 줄인 것이 도로 커지므로, 그 브랜치는 이 작업이 끝나면
# 지운다 — 지워진 브랜치의 객체는 클론이 받아 가지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill.yml'

permissions:
  contents: write

concurrency:
  group: release        # release.yml 과 같은 자리를 건드린다
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk-archive-temp

      - name: 하나씩 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, urllib.error, urllib.request

          TOKEN, REPO = os.environ["GH_TOKEN"], os.environ["REPO"]
          API = f"https://api.github.com/repos/{REPO}"
          UP  = f"https://uploads.github.com/repos/{REPO}/releases"

          def call(url, data=None, ctype="application/json", method=None):
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              if data is not None:
                  req.add_header("Content-Type", ctype)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          made = skipped = 0
          for row in json.load(open("backfill.json")):
              tag = row["tag"]
              if call(f"{API}/releases/tags/{tag}")[0] == 200:
                  print(f"  {tag:<6} 이미 있음 — 넘어감")
                  skipped += 1
                  continue

              blob = open(row["file"], "rb").read()
              got = hashlib.sha256(blob).hexdigest()
              if got != row["sha256"] or len(blob) != row["size"]:
                  sys.exit(f"{tag}: 파일이 기록과 다릅니다 ({len(blob)} · {got[:12]})")

              # 옛 판본이므로 '최신'으로 잡히면 안 된다. 앱은 app/latest.json 을
              # 보지만, 사람이 여는 releases/latest 는 이 값이 정한다.
              body = json.dumps({
                  "tag_name": tag,
                  "name": f"{tag} (versionCode {row['versionCode']})",
                  "body": row["notes"] or "",
                  "draft": False, "prerelease": False, "make_latest": "false",
              }, ensure_ascii=False).encode()
              st, rel = call(f"{API}/releases", body)
              if "id" not in rel:
                  sys.exit(f"{tag}: 릴리스를 만들지 못했습니다 ({st}) {rel}")

              st, asset = call(f"{UP}/{rel['id']}/assets?name=gijul-direct.apk",
                               blob, "application/vnd.android.package-archive")
              if asset.get("state") != "uploaded" or asset.get("size") != row["size"]:
                  sys.exit(f"{tag}: 자산을 올리지 못했습니다 ({st}) {asset}")

              print(f"  {tag:<6} {asset['size']:>9} 바이트  {row['notes'][:34]}")
              made += 1

          print(f"\n새로 만든 릴리스 {made}개 · 이미 있어 넘어간 것 {skipped}개")
          PY
